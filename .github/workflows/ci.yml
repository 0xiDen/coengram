name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/17/bin/pg_dump" --version \
            | grep --extended-regexp '^pg_dump \(PostgreSQL\) 17[.]'

      - name: Install CoEngram with development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Verify source and real infrastructure contracts
        run: make verify

      - name: Build and validate Python distributions
        run: make package

      - name: Upload verified Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coengram-python-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
