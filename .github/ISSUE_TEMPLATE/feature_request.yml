name: Feature request
description: Propose a focused capability or operator improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user, Agent, Tenant, or operator problem needs solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe externally visible behavior rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundary impact
      description: Explain identity, privacy, Tenant isolation, consistency, and recovery implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
