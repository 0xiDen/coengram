name: coengram-shared

x-application-image: &application-image
  image: ${MEMORY_PLATFORM_IMAGE:?Set MEMORY_PLATFORM_IMAGE to a released platform image}

x-application-environment: &application-environment
  MEMORY_CONTROL_DATABASE_HOST: postgres
  MEMORY_CONTROL_DATABASE_PORT: "5432"
  MEMORY_CONTROL_DATABASE_NAME: memory_control
  MEMORY_CONTROL_DATABASE_USER: ${POSTGRES_CONTROL_USER:-memory_control}
  MEMORY_CONTROL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  MEMORY_AMQP_HOST: rabbitmq
  MEMORY_AMQP_PORT: "5672"
  MEMORY_AMQP_USER: ${RABBITMQ_USER:-memory}
  MEMORY_AMQP_VHOST: memory
  MEMORY_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_password
  MEMORY_TELEMETRY_HMAC_KEY_FILE: /run/secrets/telemetry_hmac_key
  MEMORY_AMQP_EXCHANGE: memory.events.v1
  MEMORY_AMQP_GRAPH_QUEUE: memory.graph.apply.v1
  MEMORY_AMQP_DEAD_LETTER_EXCHANGE: memory.dead-letter.v1
  MEMORY_AMQP_DEAD_LETTER_QUEUE: memory.graph.dead-letter.v1
  MEMORY_TENANT_CREDENTIALS_DIR: /run/secrets/tenants
  MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-/opt/coengram/models/bge-small-en-v1.5}
  MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-384}
  HF_HOME: /models
  MEMORY_OTEL_ENDPOINT: http://alloy:4318
  MEMORY_OTEL_PROTOCOL: http/protobuf
  MEMORY_WORKER_METRICS_PORT: "9090"

x-application-volumes: &application-volumes
  - type: bind
    source: ${TENANT_SECRETS_DIR:-./secrets/tenants}
    target: /run/secrets/tenants
    read_only: true

x-application-security: &application-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.10.2}
    image: ${MEMORY_CADDY_IMAGE:-local/memory-caddy:2.10.2}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      MEMORY_PUBLIC_HOST_FILE: /run/secrets/memory_public_host
    secrets:
      - cloudflare_api_token
      - memory_public_host
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backplane
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      memory.telemetry: "true"

  gateway:
    <<: [*application-image, *application-security]
    # The released image must expose its gateway command; keeping this required
    # prevents the deployment skeleton from guessing an application entrypoint.
    command: ${MEMORY_GATEWAY_COMMAND:?Set MEMORY_GATEWAY_COMMAND for the released image}
    restart: unless-stopped
    depends_on:
      migrate-control:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *application-environment
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
      MEMORY_PUBLIC_HOST_FILE: /run/secrets/memory_public_host
    secrets:
      - postgres_password
      - rabbitmq_password
      - telegram_bot_token
      - telegram_webhook_secret
      - memory_public_host
      - telemetry_hmac_key
    volumes: *application-volumes
    group_add:
      - ${TENANT_SECRETS_GID:?Set TENANT_SECRETS_GID to the dedicated host secrets group ID}
    expose:
      - "8080"
    networks:
      - edge
      - backplane
    labels:
      memory.telemetry: "true"

  worker:
    <<: [*application-image, *application-security]
    command: ${MEMORY_WORKER_COMMAND:?Set MEMORY_WORKER_COMMAND for the released image}
    restart: unless-stopped
    depends_on:
      migrate-control:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *application-environment
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets:
      - postgres_password
      - rabbitmq_password
      - anthropic_api_key
      - telemetry_hmac_key
    volumes: *application-volumes
    group_add:
      - ${TENANT_SECRETS_GID:?Set TENANT_SECRETS_GID to the dedicated host secrets group ID}
    networks:
      - edge
      - backplane
    labels:
      memory.telemetry: "true"

  migrate-control:
    <<: [*application-image, *application-security]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMORY_CONTROL_DATABASE_HOST: postgres
      MEMORY_CONTROL_DATABASE_PORT: "5432"
      MEMORY_CONTROL_DATABASE_NAME: memory_control
      MEMORY_CONTROL_DATABASE_USER: ${POSTGRES_CONTROL_USER:-memory_control}
      MEMORY_CONTROL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export CONTROL_DATABASE_URL="postgresql+psycopg://${POSTGRES_CONTROL_USER:-memory_control}:$$(tr -d '\r\n'
        < /run/secrets/postgres_password)@postgres:5432/memory_control";
        exec alembic -c /app/alembic-control.ini upgrade head
    networks:
      - backplane

  postgres:
    build:
      context: ./postgres
      target: control
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-17.6-alpine}
        POSTGRES_DIGEST: ${POSTGRES_DIGEST:-sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94}
    image: ${MEMORY_POSTGRES_IMAGE:-local/memory-postgres:17.6}
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory_control
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-memory_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_CONTROL_USER: ${POSTGRES_CONTROL_USER:-memory_control}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-memory_metrics}
    secrets:
      - postgres_password
      - postgres_admin_password
      - postgres_exporter_password
    ports:
      - "127.0.0.1:${POSTGRES_OPERATOR_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backplane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.19.1}@${POSTGRES_EXPORTER_DIGEST:-sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/memory_control?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-memory_metrics}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
      PG_EXPORTER_COLLECTION_TIMEOUT: 10s
    secrets:
      - postgres_exporter_password
    networks:
      - backplane
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      memory.telemetry: "true"

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4.1-management-alpine}@${RABBITMQ_DIGEST:-sha256:218487e5c22d92a990c7ad42133b7e8784c4956f8d395cd89ce2cac6abc8a8fa}
    restart: unless-stopped
    environment:
      MEMORY_RABBITMQ_SEED_USER: ${RABBITMQ_USER:-memory}
      MEMORY_RABBITMQ_SEED_PASSWORD_FILE: /run/secrets/rabbitmq_password
    entrypoint: ["/bin/bash", "/etc/rabbitmq/memory-entrypoint.sh"]
    command: ["rabbitmq-server"]
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/entrypoint.sh:/etc/rabbitmq/memory-entrypoint.sh:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - backplane
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      memory.telemetry: "true"

  docker-socket-proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/docker-api-proxy.Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-api-proxy/Caddyfile:/etc/caddy/docker-api-proxy.Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-api
    labels:
      memory.telemetry: "true"

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.10.2}@${ALLOY_DIGEST:-sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223}
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - backplane
      - docker-api
    security_opt:
      - no-new-privileges:true
    labels:
      memory.telemetry: "true"

  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-2.17.1}@${MIMIR_DIGEST:-sha256:f97a1a6885a0c8ee80bc8f14343183dd67e9786cfbc18198d9a4138354fda55e}
    restart: unless-stopped
    command: ["-config.file=/etc/mimir/config.yaml"]
    volumes:
      - ../ops/observability/mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir_data:/data
    networks:
      - backplane
    security_opt:
      - no-new-privileges:true
    labels:
      memory.telemetry: "true"

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.5}@${LOKI_DIGEST:-sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../ops/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - backplane
    security_opt:
      - no-new-privileges:true
    labels:
      memory.telemetry: "true"

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.8.2}@${TEMPO_DIGEST:-sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../ops/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - backplane
    security_opt:
      - no-new-privileges:true
    labels:
      memory.telemetry: "true"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.1}@${GRAFANA_DIGEST:-sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d}
    restart: unless-stopped
    depends_on:
      - mimir
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-memory-operator}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ../ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_OPERATOR_PORT:-3000}:3000"
    networks:
      - backplane
    security_opt:
      - no-new-privileges:true
    labels:
      memory.telemetry: "true"

secrets:
  cloudflare_api_token:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/cloudflare_api_token
  memory_public_host:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/memory_public_host
  postgres_password:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/postgres_password
  postgres_admin_password:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/postgres_admin_password
  rabbitmq_password:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/rabbitmq_password
  telemetry_hmac_key:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/telemetry_hmac_key
  anthropic_api_key:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/anthropic_api_key
  telegram_bot_token:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/telegram_bot_token
  telegram_webhook_secret:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/telegram_webhook_secret
  grafana_admin_password:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/grafana_admin_password
  postgres_exporter_password:
    file: ${MEMORY_SECRETS_DIR:-./secrets}/postgres_exporter_password

networks:
  edge:
  backplane:
    name: memory-backplane
    internal: true
    attachable: true
  docker-api:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rabbitmq_data:
  alloy_data:
  mimir_data:
  loki_data:
  tempo_data:
  grafana_data:
