# Values are loaded from the file-backed secret by memory-entrypoint.sh. The
# restricted alphabet keeps interpolation safe inside quoted rabbitmq.conf values.
default_user = '$(MEMORY_RABBITMQ_SEED_USER)'
default_pass = '$(MEMORY_RABBITMQ_SEED_PASSWORD)'
default_vhost = memory
default_user_tags.administrator = false
default_permissions.configure = ^memory[.]
default_permissions.write = ^memory[.]
default_permissions.read = ^memory[.]

prometheus.tcp.port = 15692
prometheus.return_per_object_metrics = true
